schema_version: 1

split_roles:
  train: supervised fine-tuning and training-split label extraction
  validation: method design, prompt search, and failure analysis
  proxy_dev_seen: historical continuity slice, not a clean benchmark claim
  clean_local_holdout: final local method comparison
  external_target: hosted or benchmark transfer target

protocols:
  - protocol_id: cosql_proxy_teacher_forced
    benchmark: CoSQL fixed proxy slice
    role: fast local continuity signal for multi-turn SQL
    turn_policy: gold_sql_teacher_forced_history
    row_identity_policy: expanded dialog turn ids over the same prepared input hash
    scorer_policy: SQLite execution with value and strict accuracy
    primary_metrics:
      - value_accuracy
      - strict_accuracy
      - syntax_accuracy
      - interaction_match
    required_artifacts:
      - prepared input manifest
      - result manifest
      - same-row comparison manifest for deltas
    allowed_claims:
      - proxy improvement on a fixed seen CoSQL slice
      - failure taxonomy for method selection
    blocked_claims:
      - clean holdout improvement
      - hosted SOTA comparison
      - external benchmark transfer
    leakage_boundary: >-
      Prompts may use the question, dialog history up to the current turn,
      schema, semantic context, and database-derived retrieval context.
      Reference SQL, expected rows, future turns, and evaluation answers stay
      scorer-side.
    supports_method_ranking: true
    supports_hosted_sota_claim: false

  - protocol_id: generated_history_rollout
    benchmark: generated-history multi-turn rollout
    role: recovery and self-conditioning evaluation
    turn_policy: model_generated_sql_rollout
    row_identity_policy: dialog and turn ids match the teacher-forced control
    scorer_policy: sequential SQLite execution after each generated turn
    primary_metrics:
      - rollout_value_accuracy
      - rollout_strict_accuracy
      - syntax_accuracy
      - interaction_match
    required_artifacts:
      - rollout input manifest
      - rollout result manifest
      - teacher-forced comparison manifest
    allowed_claims:
      - a recovery method handles generated history better than direct SQL
    blocked_claims:
      - hosted SOTA comparison unless hosted rollout uses the same protocol
    leakage_boundary: >-
      Prompts may include previous generated SQL and observed rows. Repair
      labels, reference SQL, expected rows, and future turns stay scorer-side.
    supports_method_ranking: true
    supports_hosted_sota_claim: false

  - protocol_id: synthetic_method_fixture
    benchmark: small synthetic fixtures
    role: isolated method smoke tests
    turn_policy: curated single-turn or short generated-history rows
    row_identity_policy: fixture ids versioned in artifact manifests
    scorer_policy: fixture-specific parser, compiler, value, alias, or execution checks
    primary_metrics:
      - parse_rate
      - compile_rate
      - value_accuracy
      - strict_accuracy
      - recovery_success
    required_artifacts:
      - fixture JSONL
      - fixture manifest
      - method-specific result manifest
    allowed_claims:
      - a behavior is measurable in isolation
      - a method is ready for validation-slice testing
    blocked_claims:
      - real benchmark improvement
      - hosted SOTA comparison
    leakage_boundary: >-
      Synthetic labels may be training labels or scorer fields, but evaluation
      prompts must not include hidden answers, expected rows, or future turns.
    supports_method_ranking: false
    supports_hosted_sota_claim: false

  - protocol_id: clean_local_holdout
    benchmark: frozen held-out local multi-turn SQL slice
    role: local benchmark claim
    turn_policy: teacher-forced and generated-history variants recorded separately
    row_identity_policy: frozen split manifest shared by every local method
    scorer_policy: same SQLite scorer and database root for every run
    primary_metrics:
      - value_accuracy
      - strict_accuracy
      - syntax_accuracy
      - interaction_match
      - latency
    required_artifacts:
      - split manifest
      - prepared input manifest
      - raw Qwen result manifest
      - best local adapter result manifest
      - local comparison manifest
    allowed_claims:
      - best local fine-tuned adapter beats raw Qwen on clean holdout
      - a method beats direct SQL on clean holdout
    blocked_claims:
      - hosted SOTA comparison
    leakage_boundary: >-
      Method selection must happen before holdout scoring. Holdout answers can
      be used by the scorer only.
    supports_method_ranking: true
    supports_hosted_sota_claim: false

  - protocol_id: hosted_sota_row_matched
    benchmark: local holdout or external target with hosted comparator
    role: local-vs-hosted comparison
    turn_policy: benchmark-specific, identical for local and hosted runs
    row_identity_policy: local and hosted result rows must match exactly
    scorer_policy: same scorer, database root, and row identity validation
    primary_metrics:
      - value_accuracy
      - strict_accuracy
      - interaction_match
      - latency
      - cost
    required_artifacts:
      - local result manifest
      - hosted result manifest
      - local-vs-hosted comparison manifest
    allowed_claims:
      - local fine-tuning closes, matches, or fails to close the hosted gap
      - method transfers beyond the CoSQL proxy when an external target is used
    blocked_claims: []
    leakage_boundary: >-
      Local and hosted prompts must receive the same prompt-visible inputs.
      Hidden benchmark answers, expected rows, evaluator state, and future turns
      stay outside all prompts.
    supports_method_ranking: true
    supports_hosted_sota_claim: true
