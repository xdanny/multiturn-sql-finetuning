schema_version: 1
matrix_id: multiturn_sql_hypothesis_matrix_v1
claim_boundary: >-
  This matrix is the experiment contract, not a result. A hypothesis is not
  promoted until its validation artifact and locked benchmark artifact both
  exist, use non-oracle prompts, and beat the declared control on identical row
  identities.
holdout_policy: >-
  CoSQL dev 100 is a locked proxy benchmark, but not a pristine scientific
  holdout because earlier prompt and evidence iteration inspected it. Treat it
  as a reproducible proxy gate. Hosted and BIRD-Interact transfer rows remain
  the clean external holdout for broad claims.
hypotheses:
  - hypothesis_id: direct_sql_sft
    method: Direct SQL SFT
    question: Does ordinary supervised SQL chat tuning beat the base model?
    train_artifacts:
      - data/processed/train_smoke.jsonl
      - data/processed/train.jsonl
    validation_artifacts:
      - data/processed/eval_cosql_smoke.jsonl
    locked_benchmark_artifacts:
      - data/processed/eval_cosql_dev_100.jsonl
    control_hypothesis_id: base_model
    primary_metric: value_execution_accuracy
    promotion_gate: >-
      Fine-tuned direct-SQL adapter beats base model on the locked proxy with
      matching input hash, scorer hash, row count, and non-oracle prompts.
    leakage_checks:
      - no reference SQL in prompt
      - no gold plan in prompt
      - no expected rows in prompt
      - no future turns in prompt
    current_status: supported_proxy_control
    next_gpu_run: >-
      Train a small direct-SQL adapter on train rows, choose settings on smoke
      validation, then evaluate once on the locked proxy.

  - hypothesis_id: planner_first_sql
    method: Planner/DSL first, SQL second
    question: Does predicting table/column/join/projection state before SQL improve execution?
    train_artifacts:
      - data/processed/train_64_each_semantic.jsonl
    validation_artifacts:
      - data/processed/eval_cosql_dev_planner_100.jsonl
      - results/planner_eval_cosql_dev_100_summary.json
    locked_benchmark_artifacts:
      - data/processed/eval_cosql_dev_predicted_planner_100.jsonl
    control_hypothesis_id: direct_sql_sft
    primary_metric: value_accuracy_delta_vs_direct_sql
    promotion_gate: >-
      Predicted-planner SQL beats the direct-SQL arm on identical locked proxy
      rows, while planner table/column/projection metrics improve on validation.
    leakage_checks:
      - predicted plans are produced without reference SQL
      - gold plans are scorer-side only
      - direct and predicted rows share row identity
    current_status: planner_quality_only
    next_gpu_run: >-
      Train or prompt a non-oracle planner on train/validation rows, freeze the
      planner, then evaluate generated SQL against direct SQL on locked rows.

  - hypothesis_id: semantic_value_retrieval
    method: Semantic-layer tuning
    question: Do database-derived values, entities, and semantic hints fix SQL misses?
    train_artifacts:
      - data/processed/train_semantic_smoke.jsonl
      - docs/data_artifacts/semantic_value_retrieval_inputs.manifest.json
    validation_artifacts:
      - docs/data_artifacts/value_index_cosql_dev_100_summary.json
      - docs/data_artifacts/semantic_value_retrieval_inputs_summary.json
    locked_benchmark_artifacts:
      - data/processed/eval_cosql_dev_100_semantic_value_retrieval.jsonl
    control_hypothesis_id: direct_sql_sft
    primary_metric: value_accuracy_delta_vs_direct_sql
    promotion_gate: >-
      Semantic value-retrieval prompts or adapter beat direct SQL on identical
      rows, with value-index provenance recorded in the comparison manifest.
    leakage_checks:
      - value index comes from database contents
      - answer-derived value labels are not prompt-visible
      - semantic and direct rows share row identity
    current_status: supported_retrieval_coverage_only
    next_gpu_run: >-
      Train a semantic-target adapter and compare it to direct SQL on the same
      validation rows before using the locked proxy.

  - hypothesis_id: metric_dsl
    method: MEASURE()-preserving metric DSL
    question: Is it better to preserve governed metric intent before compiling SQL?
    train_artifacts:
      - docs/data_artifacts/metric_dsl_training_rows.jsonl
      - docs/data_artifacts/metric_dsl_direct_sql_training_rows.jsonl
    validation_artifacts:
      - docs/data_artifacts/metric_dsl_prediction_inputs.jsonl
      - docs/data_artifacts/metric_dsl_direct_sql_prediction_inputs.jsonl
    locked_benchmark_artifacts:
      - docs/data_artifacts/synthetic_method_fixtures.manifest.json
    control_hypothesis_id: direct_sql_sft
    primary_metric: metric_dsl_value_delta_vs_direct_sql
    promotion_gate: >-
      Metric DSL parses, preserves MEASURE(), compiles, and beats direct SQL on
      matching metric-heavy fixtures.
    leakage_checks:
      - semantic metric definitions may be prompt-visible
      - gold DSL stays scorer-side
      - reference SQL stays scorer-side
    current_status: parser_compiler_only
    next_gpu_run: >-
      Train separate metric-DSL and direct-SQL fixture adapters, generate held
      validation predictions, then run the compiled-SQL comparison.

  - hypothesis_id: behavior_recovery
    method: Behavior/recovery tuning
    question: Can the model recover after its own wrong SQL or empty result?
    train_artifacts:
      - docs/data_artifacts/behavior_recovery_training_rows.jsonl
      - docs/data_artifacts/behavior_recovery_direct_sql_training_rows.jsonl
    validation_artifacts:
      - docs/data_artifacts/behavior_recovery_rollout_inputs.jsonl
    locked_benchmark_artifacts:
      - docs/data_artifacts/behavior_recovery_rollout_inputs.manifest.json
    control_hypothesis_id: direct_sql_sft
    primary_metric: rollout_value_accuracy_delta_vs_direct_sql
    promotion_gate: >-
      Recovery adapter beats direct-SQL control under generated-history rollout,
      not teacher-forced history.
    leakage_checks:
      - previous generated SQL and observed rows may be prompt-visible
      - repair labels are not prompt-visible
      - future turns are not prompt-visible
    current_status: training_rows_only
    next_gpu_run: >-
      Train recovery and direct-control adapters, then compare generated-history
      rollout against teacher-forced and direct-control manifests.

  - hypothesis_id: hosted_transfer
    method: Hosted and BIRD-Interact comparison
    question: Can the best local 9B method compete with hosted models on data analysis?
    train_artifacts: []
    validation_artifacts:
      - docs/claim_ledgers/cosql_dev_100.jsonl
    locked_benchmark_artifacts: []
    control_hypothesis_id: best_local_proxy_method
    primary_metric: value_accuracy_delta_vs_hosted_baseline
    promotion_gate: >-
      Local and hosted runs share inputs, scorer, oracle boundary, latency, and
      cost accounting, then transfer to BIRD-Interact or equivalent interactive
      rows.
    leakage_checks:
      - local and hosted prompts receive the same inputs
      - hidden benchmark answers stay evaluator-side
      - no method is selected on the final transfer rows
    current_status: not_started
    next_gpu_run: >-
      Do not run this until at least one local method beats direct SQL on locked
      proxy rows.
