schema_version: 1
registry_status: checkpoint_1_compact_registry
description: >-
  Compact experiment registry for roadmap work. It names what each method is
  trying to test before runbooks or status tables rank the result.
experiments:
  - experiment_id: direct_sql_full_non_oracle_control
    checkpoint: 3
    status: checkpoint3_complete_direct_sql_control
    hypothesis_id: direct_sql_sft
    hypothesis: >-
      A direct SQL SFT adapter is the stable control arm for every structured
      method comparison.
    train_split_id: cosql_train_v1
    validation_split_id: cosql_dev_100_proxy_seen_v1
    test_split_id: cosql_dev_clean_holdout_v1
    dataset_role: clean_local_holdout
    benchmark_protocol_id: cosql_dev_100_teacher_forced_proxy
    model: unsloth/Qwen3.5-9B
    adapter: outputs/experiments/direct_sql_full/final
    method: direct_sql
    oracle_policy: non_oracle_generation
    scorer: eval.run_eval:value_and_strict_execution_v1
    output_path: results/runs/direct_sql_full_non_oracle_control
    control_experiment_id: null
    primary_metric: value_accuracy
    claim_boundary: >-
      The full direct-SQL control baseline is measured on the configured
      proxy, clean-holdout, and generated-history rollout rows. This is the
      control baseline for later method comparisons, not a hosted benchmark or
      structured-method win.

  - experiment_id: structured_brief_sql_vs_direct
    checkpoint: 5
    status: structured_brief_clean_holdout_promoted
    hypothesis_id: structured_query_brief
    hypothesis: >-
      A model trained to emit a compact visible query brief before SQL can beat
      the direct-SQL finetuned control on row-matched multi-turn benchmarks.
    train_split_id: cosql_train_v1
    validation_split_id: cosql_dev_100_proxy_seen_v1
    test_split_id: cosql_dev_clean_holdout_v1
    dataset_role: clean_local_holdout
    benchmark_protocol_id: cosql_dev_100_teacher_forced_proxy
    model: unsloth/Qwen3.5-9B
    adapter: outputs/experiments/structured_brief_sql/full_20260602/final
    method: structured_brief_sql
    oracle_policy: non_oracle_generation
    scorer: eval.run_structured_brief_comparison:value_delta_vs_direct_sql
    output_path: results/runs/structured_brief_sql_vs_direct
    control_experiment_id: direct_sql_full_non_oracle_control
    primary_metric: structured_brief_value_delta_vs_direct_sql
    claim_boundary: >-
      This is the active Checkpoint 5 replacement for the over-engineered
      planner gate. Training-split reference SQL may supervise compact query
      briefs, but clean-holdout prompts must not include scorer-only labels,
      reference SQL, expected rows, future turns, gold plans, gold DSL, or
      repair labels. Promotion requires a same-row clean-holdout benchmark
      comparison with positive value-accuracy delta versus direct SQL, with
      strict accuracy, syntax rate, interaction match, latency, and cost
      reported. The full structured-brief adapter trained for the matched
      1,620-step budget and passed same-row clean-holdout comparison against
      the direct-SQL LoRA control: value accuracy `0.576` versus `0.349`,
      strict accuracy `0.541` versus `0.349`, value delta `+0.228`, and strict
      delta `+0.193` on 680 comparable turns. This is a local clean-holdout
      method win, not a hosted benchmark claim.

  - experiment_id: semantic_value_retrieval_vs_direct
    checkpoint: 6
    status: semantic_pruned_clean_holdout_promoted
    hypothesis_id: semantic_value_grounding
    hypothesis: >-
      Database-derived value retrieval and semantic context improve
      display-to-storage value grounding without exposing scorer-only labels.
    train_split_id: cosql_train_v1
    validation_split_id: cosql_dev_100_proxy_seen_v1
    test_split_id: cosql_dev_clean_holdout_v1
    dataset_role: clean_local_holdout
    benchmark_protocol_id: cosql_dev_100_teacher_forced_proxy
    model: unsloth/Qwen3.5-9B
    adapter: outputs/experiments/semantic_value_retrieval/final
    method: semantic_value_retrieval
    oracle_policy: non_oracle_generation
    scorer: eval.run_semantic_value_retrieval_comparison:value_delta_vs_direct_sql
    output_path: results/runs/semantic_value_retrieval_vs_direct
    control_experiment_id: direct_sql_full_non_oracle_control
    primary_metric: semantic_value_delta_vs_direct_sql
    claim_boundary: >-
      Full clean-holdout endpoint comparison regressed versus direct SQL:
      semantic value accuracy delta was negative and strict accuracy also
      regressed. A follow-up pruning policy now uses current-turn retrieval,
      caps matches at 4 per turn, prunes short ambiguous aliases, and has passed
      clean-holdout endpoint-pair preflight. The pruned endpoint pair then
      passed the current promotion policy with a very narrow clean-holdout win:
      value accuracy delta +0.00147 and strict accuracy delta +0.00294 versus
      direct SQL on 680 comparable turns. This is a local method result, not a
      hosted benchmark claim.

  - experiment_id: metric_dsl_vs_direct_sql
    checkpoint: 7
    status: diagnostic_negative
    hypothesis_id: metric_dsl
    hypothesis: >-
      Metric-heavy questions benefit from preserving governed MEASURE intent
      before SQL compilation.
    train_split_id: synthetic_method_fixtures_v1
    validation_split_id: synthetic_method_fixtures_v1
    test_split_id: synthetic_method_fixtures_v1
    dataset_role: validation
    benchmark_protocol_id: synthetic_schema_rich_method_fixture
    model: unsloth/Qwen3.5-9B
    adapter: outputs/experiments/metric_dsl/final
    method: metric_dsl
    oracle_policy: non_oracle_generation
    scorer: eval.run_metric_dsl_comparison:compiled_value_delta_vs_direct_sql
    output_path: results/runs/metric_dsl_vs_direct_sql
    control_experiment_id: direct_sql_full_non_oracle_control
    primary_metric: metric_dsl_value_delta_vs_direct_sql
    claim_boundary: >-
      Existing two-row prompt and five-step evidence is negative diagnostic
      evidence, not a method win.

  - experiment_id: generated_history_recovery_vs_direct
    checkpoint: 8
    status: diagnostic_negative
    hypothesis_id: behavior_recovery
    hypothesis: >-
      A recovery-tuned adapter should continue after its own generated SQL and
      observed results better than the direct-SQL control.
    train_split_id: synthetic_method_fixtures_v1
    validation_split_id: synthetic_method_fixtures_v1
    test_split_id: synthetic_method_fixtures_v1
    dataset_role: validation
    benchmark_protocol_id: cosql_generated_history_rollout
    model: unsloth/Qwen3.5-9B
    adapter: outputs/experiments/behavior_recovery/final
    method: behavior_recovery
    oracle_policy: non_oracle_generation
    scorer: eval.run_behavior_recovery_comparison:rollout_value_delta_vs_direct_sql
    output_path: results/runs/generated_history_recovery_vs_direct
    control_experiment_id: direct_sql_full_non_oracle_control
    primary_metric: rollout_value_accuracy_delta_vs_direct_sql
    claim_boundary: >-
      Existing one-row generated-history evidence did not beat direct SQL; scale
      only after value and schema repair are stable.

  - experiment_id: hosted_bird_interact_transfer
    checkpoint: 9
    status: target_gap_recorded
    hypothesis_id: hosted_transfer
    hypothesis: >-
      The best local finetuned candidate should be measured against both raw
      base Qwen and a hosted SOTA comparator before any external benchmark
      claim.
    train_split_id: cosql_train_v1
    validation_split_id: cosql_dev_clean_holdout_v1
    test_split_id: bird_interact_lite_pending_v1
    dataset_role: external_target
    benchmark_protocol_id: bird_interact_same_protocol_transfer
    model: unsloth/Qwen3.5-9B
    adapter: outputs/experiments/best_local_candidate/final
    method: hosted_transfer_comparison
    oracle_policy: non_oracle_generation
    scorer: eval.compare_hosted_baseline:local_value_delta_vs_hosted
    output_path: results/runs/hosted_bird_interact_transfer
    control_experiment_id: direct_sql_full_non_oracle_control
    primary_metric: local_value_delta_vs_hosted
    claim_boundary: >-
      Same-row CoSQL generated-history target-gap evidence exists for raw
      Qwen, the best finetuned recovery adapter, and OpenRouter Claude Sonnet
      4.6. This is not a BIRD-Interact, LiveSQLBench, or external benchmark
      claim.

  - experiment_id: semantic_context_transfer_with_hosted
    checkpoint: 10
    status: planned_semantic_context_transfer
    hypothesis_id: semantic_context_transfer
    hypothesis: >-
      The same non-oracle semantic/value context should improve database
      navigation for local Qwen and OpenRouter Claude Sonnet 4.6, and may narrow
      the local-versus-hosted gap if the local model benefits more.
    train_split_id: cosql_train_v1
    validation_split_id: cosql_dev_clean_holdout_v1
    test_split_id: cosql_dev_clean_holdout_v1
    dataset_role: clean_local_holdout
    benchmark_protocol_id: cosql_semantic_context_transfer
    model: unsloth/Qwen3.5-9B
    adapter: outputs/experiments/structured_brief_sql/full_20260602/final
    method: semantic_context_transfer
    oracle_policy: non_oracle_generation
    scorer: eval.compare_hosted_baseline:semantic_context_delta_vs_hosted
    output_path: results/runs/semantic_context_transfer_with_hosted
    control_experiment_id: hosted_bird_interact_transfer
    primary_metric: local_semantic_context_value_delta_vs_hosted
    claim_boundary: >-
      Planned same-row semantic-context transfer comparison. Prompt context may
      include schema-derived semantic context and database-derived value
      matches, but must not include reference SQL, expected rows, future turns,
      gold DSL, repair labels, answer-derived table or column hints, or any
      value match produced by reading the reference answer. Sonnet 4.6 should
      receive the same class of semantic/value context as the local model before
      any local-versus-hosted gap claim is made.
