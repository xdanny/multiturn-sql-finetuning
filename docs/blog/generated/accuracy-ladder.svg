<text x="34" y="64" font-family="Arial, sans-serif" font-size="14" fill="#555">Fixed 100-turn CoSQL slice. Grey bars are oracle diagnostics.</text>
<line x1="78" y1="332" x2="864" y2="332" stroke="#222"/>
