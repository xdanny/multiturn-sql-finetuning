[project]
name = "multiturn-sql-finetuning"
version = "0.1.0"
description = "Fine-tune Qwen 3.5 9B on multi-turn SQL with Unsloth and benchmark base-vs-LoRA locally"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Dan Suman" }]
dependencies = [
    # Training
    "transformers>=5.0.0",
    "trl>=0.12.0",
    "peft>=0.14.0",
    "accelerate>=1.2.0",
    "datasets>=3.0.0",
    "bitsandbytes>=0.45.3",
    "sentencepiece",
    "protobuf",
    "wandb",
    # Unsloth (Blackwell + Qwen 3.5 support)
    "unsloth>=2026.4.0",
    # Evaluation
    "ragas>=0.4.3",
    "langchain-community<0.4",
    "langchain-google-vertexai",
    "datacompy>=0.13.0",
    "sqlparse>=0.5.0",
    "sqlglot>=25.0.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "dspy>=3.2.0",
    # API baselines
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-genai>=0.3.0",
    # Utilities
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
    "gdown>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "ipykernel>=6.29.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data", "eval", "train"]
